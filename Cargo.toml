[workspace]
members = ["crates/*"]
exclude = ["crates/crosswire-h1/fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.88"
repository = "https://github.com/kalash33/crosswire"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
sha2 = "0.10"
ulid = "1"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
time = "0.3"
rustix = { version = "1", features = ["fs"] }
lru = "0.19"
tempfile = "3"
x509-parser = "0.18"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
dirs = "6"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
utoipa = { version = "6", features = ["axum_extras", "ulid"] }
utoipa-axum = "0.3"
regex = "1"
ipnet = "2"
rand = "0.9"
subtle = "2"
http = "1"
url = "2"
