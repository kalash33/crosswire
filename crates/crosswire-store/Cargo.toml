[package]
name = "crosswire-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Exchange store (SQLite plus packs) for Crosswire"
publish = false

[lints]
workspace = true

[dependencies]
rusqlite = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
rustix = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
crosswire-model = { path = "../crosswire-model", version = "0.0.0" }
# The event stream is a broadcast channel; nothing else of tokio is needed.
tokio = { version = "1", default-features = false, features = ["sync"] }
# Used by the kill -9 test child to build bodies.
bytes = "1"


[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
# Already a normal dependency (so this adds nothing to the dependency graph or
# `cargo deny`); the index tests use it to drive raw SQL — simulate an older
# project and read back `user_version`/`sqlite_master`.
rusqlite = { workspace = true }
crosswire-core = { path = "../crosswire-core", version = "0.0.0" }
crosswire-h1 = { path = "../crosswire-h1", version = "0.0.0" }

# Spawned and SIGKILLed by tests/durability.rs.
[[bin]]
name = "killtest-child"
path = "src/bin/killtest-child.rs"
test = false
doc = false
