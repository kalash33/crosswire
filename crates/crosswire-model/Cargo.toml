[package]
name = "crosswire-model"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Frozen exchange schema and sink traits for Crosswire"
publish = false

[lints]
workspace = true

[dependencies]
crosswire-core = { path = "../crosswire-core", version = "0.0.0", default-features = false, features = ["serde"] }
crosswire-h1 = { path = "../crosswire-h1", version = "0.0.0", default-features = false, features = ["serde"] }
bytes = { version = "1", default-features = false }
serde = { workspace = true }
ulid = { version = "1", default-features = false }

[features]
default = ["std"]
std = ["crosswire-core/std", "crosswire-h1/std", "serde/std", "bytes/std", "ulid/std"]

[dev-dependencies]
serde_json = { workspace = true }
