[package]
name = "crosswire-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The crosswire binary: serve the MITM proxy and the project store"
publish = false

[lints]
workspace = true

[[bin]]
name = "crosswire"
path = "src/main.rs"

[dependencies]
crosswire-proxy = { path = "../crosswire-proxy", version = "0.0.0" }
crosswire-store = { path = "../crosswire-store", version = "0.0.0" }
crosswire-ca = { path = "../crosswire-ca", version = "0.0.0" }
crosswire-client = { path = "../crosswire-client", version = "0.0.0" }
crosswire-model = { path = "../crosswire-model", version = "0.0.0" }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
