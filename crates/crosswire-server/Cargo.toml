[package]
name = "crosswire-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The crosswire binary: serve the MITM proxy and the project store"
publish = false

[lints]
workspace = true

[[bin]]
name = "crosswire"
path = "src/main.rs"

[dependencies]
crosswire-api = { path = "../crosswire-api" }
crosswire-proxy = { path = "../crosswire-proxy" }
crosswire-scope = { path = "../crosswire-scope" }
crosswire-store = { path = "../crosswire-store" }
crosswire-tools = { path = "../crosswire-tools" }
crosswire-ca = { path = "../crosswire-ca" }
crosswire-client = { path = "../crosswire-client" }
crosswire-model = { path = "../crosswire-model" }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
# The UI bundle is embedded at compile time from the committed, drift-checked
# copy under assets/ui/, so `cargo build` stays Node-free. `publish = false`
# keeps these binary-only deps allowed. mime_guess derives the Content-Type
# from each asset's extension.
# debug-embed keeps the bundle embedded in debug builds too, so the binary is
# self-contained (rust-embed otherwise reads from disk in debug).
rust-embed = { version = "8.5.0", features = ["debug-embed"] }
mime_guess = "2.0.5"

[dev-dependencies]
tempfile = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
x509-parser = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }

# publish = false hides the binary from dist; opt this one package in. Every
# other workspace package stays out of the release.
[package.metadata.dist]
dist = true

# cargo-binstall resolves the cargo package name (crosswire-server) and
# downloads the dist archive; the binary inside is `crosswire`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/crosswire-server-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "crosswire-server-{ target }/{ bin }{ binary-ext }"
