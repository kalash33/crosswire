[package]
name = "crosswire-h1"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "HTTP/1.1 message parsing and serialization for Crosswire"
publish = false

[lints]
workspace = true

[dependencies]
crosswire-core = { path = "../crosswire-core", default-features = false }
bytes = { version = "1", default-features = false }
http = { version = "1", optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[features]
default = ["std"]
std = ["crosswire-core/std", "bytes/std"]
http = ["dep:http"]
serde = ["dep:serde", "crosswire-core/serde"]

[dev-dependencies]
proptest = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.5", default-features = false }
httparse = "1"

[[bench]]
name = "parse"
harness = false
