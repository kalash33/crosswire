version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # release.yml is generated by cargo-dist; its action pins live in
    # dist-workspace.toml [dist.github-action-commits]. Bump them there and
    # run `dist generate`, never by editing the generated file.
    exclude-paths:
      - ".github/workflows/release.yml"
