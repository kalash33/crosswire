version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns: ["*"]
    # Most of our Rust dependencies are 0.x, where a minor bump is breaking
    # (and several sit on security paths: rusqlite, sha2, webpki-roots).
    # Take only patch updates automatically; minor and major upgrades are a
    # planned, reviewed dependency refresh.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-deps:
        patterns: ["*"]
    # svelte-check declares a peer range on TypeScript; a major bump breaks
    # `npm ci` (ERESOLVE) until svelte-check supports it. Take TypeScript
    # majors by hand once it does.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # release.yml is generated by cargo-dist; its action pins live in
    # dist-workspace.toml [dist.github-action-commits]. Bump them there and
    # run `dist generate`, never by editing the generated file.
    exclude-paths:
      - ".github/workflows/release.yml"
