name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: just lint
      - run: just test
      # Golden-corpus pairing/schema/per-code coverage (stdlib python3).
      - run: just corpus-check
        if: matrix.os == 'ubuntu-latest'
      # Real headless Chrome through the proxy (the ubuntu image ships it).
      - run: just browser-test
        if: matrix.os == 'ubuntu-latest'
      # Install-to-first-capture against the real internet, under 120 s.
      - run: just first-capture
        if: matrix.os == 'ubuntu-latest'
      # UI toolchain: ubuntu only, so cargo build and `just test` stay Node-free
      # on every OS. Node 24 matches the version that built the committed
      # bundle; ui-dist-check fails if assets/ui drifts from ui/ sources.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ui
        if: matrix.os == 'ubuntu-latest'
      - run: just ui-lint
        if: matrix.os == 'ubuntu-latest'
      - run: just ui-test
        if: matrix.os == 'ubuntu-latest'
      - run: just ui-dist-check
        if: matrix.os == 'ubuntu-latest'
      # The committed release.yml must be exactly what dist generates from
      # dist-workspace.toml; the installer is pinned to the same dist version.
      - run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.sh | sh
          dist generate --check
        if: matrix.os == 'ubuntu-latest'
      # Playwright's Chromium for the UI e2e suites (ubuntu only, so every other
      # OS stays Node-free). --with-deps adds the system libraries it needs on
      # the CI image; npm's cache above already covers ui/node_modules.
      - run: npx playwright install --with-deps chromium
        working-directory: ui
        if: matrix.os == 'ubuntu-latest'
      # The vite-preview Playwright suite (auth/byte-editor/history/xss). Task 2
      # wired Vitest only; the §12 DoD also requires Playwright green in CI. This
      # config `testIgnore`s the first-capture-ui gate, which needs a real serve.
      - run: npm --prefix ui run e2e
        if: matrix.os == 'ubuntu-latest'
      # Install-to-first-capture THROUGH THE UI (§12 DoD), after `just
      # first-capture`: a real serve with the embedded bundle, driven by
      # Playwright to prove the example.com capture reaches the history view
      # under 120 s. Real network + the image's Chrome (CROSSWIRE_BROWSER/PATH).
      - run: just first-capture-ui
        if: matrix.os == 'ubuntu-latest'
      - run: just features
      - run: just bench
      # Scaled perf guard, ubuntu only: EXPLAIN QUERY PLAN index-usage tests (the
      # hardware-independent regression guard) plus a loose 100k-row sanity run.
      # Also runs the proxy added-latency/throughput tests report-only (release).
      # The 1M latency gate is maintainer-only (`just perf`), never asserted here.
      - run: just perf-smoke
        if: matrix.os == 'ubuntu-latest'
      # Runs rustdoc with RUSTDOCFLAGS=-D warnings.
      - run: just doc
      # Only crosswire-core is packaged in CI. crosswire-h1 depends on it by
      # path + version, and `cargo package` resolves that dependency from
      # crates.io, so h1 packaging stays local-only until core is published.
      - run: just package

  # The declared rust-version (Cargo.toml) must build with the lockfile.
  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head
        with:
          toolchain: "1.88"
      - run: cargo check --workspace --locked --all-features

  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  fuzz-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      # `fuzz-smoke` first seeds the libFuzzer corpora from corpus/h1/cases.
      - run: just fuzz-smoke
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: crates/crosswire-h1/fuzz/artifacts
          if-no-files-found: ignore
